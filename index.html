<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#760b12">
<title>Josh & Aira | Wedding Invitation</title>
<style>
:root{--wine:#790b12;--pink:#f9c4c5;--gold:#d9a34a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#ffe5e4,#f6b8bb 65%,#e99ca2);font-family:Georgia,serif;color:var(--wine)}
button{font:inherit;cursor:pointer}
#cover{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.cover-card{width:min(430px,94vw);position:relative;border:2px solid #8d1118;box-shadow:0 18px 55px #5c071b55;background:#f9c4c5;border-radius:5px;overflow:hidden;transition:transform .8s,opacity .8s}
.cover-card img{display:block;width:100%;height:auto}
.open-btn{position:absolute;left:50%;bottom:4.5%;transform:translateX(-50%);white-space:nowrap;border:1px solid #f6d78e;border-radius:30px;padding:13px 25px;background:linear-gradient(135deg,#7a0711,#a51a25);color:#fff;letter-spacing:.08em;box-shadow:0 5px 18px #53000b55}
.open-btn:hover{filter:brightness(1.15)}
#book{display:none;min-height:100vh;padding:18px 12px 28px}
.topbar{max-width:620px;margin:0 auto 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#6e0710}
.topbar strong{font-size:clamp(14px,3.5vw,18px)}
.controls{display:flex;gap:7px}
.controls button{border:1px solid #8a1119;background:#fff4f0;color:#760b12;border-radius:22px;padding:9px 13px}
#musicToggle{border:1px solid #8a1119;background:#fff4f0;color:#760b12;border-radius:22px;padding:9px 13px}
.stage{width:min(560px,96vw);margin:auto;position:relative;perspective:1400px}
.page{display:none;transform-origin:left center;backface-visibility:hidden}
.page.active{display:block;animation:pageReveal .75s cubic-bezier(.2,.75,.2,1) both}
.page img{display:block;width:100%;height:auto;box-shadow:0 14px 38px #5b061b55;border:1px solid #8b1119}
@keyframes pageReveal{0%{opacity:0;transform:perspective(1400px) rotateY(-16deg) translateX(22px);filter:brightness(.92)}65%{opacity:1}100%{opacity:1;transform:perspective(1400px) rotateY(0) translateX(0);filter:brightness(1)}}
.progress{max-width:560px;margin:12px auto 0;text-align:center;color:#6e0710;font:13px Arial,sans-serif}
.dots{display:flex;justify-content:center;gap:7px;margin-top:9px}
.dots button{width:8px;height:8px;border:0;border-radius:50%;padding:0;background:#d58b8e}
.dots button.active{background:#790b12;transform:scale(1.35)}
@media(min-width:700px){#book{padding-top:24px}.stage{width:min(560px,70vw)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<section id="cover" aria-label="Wedding invitation cover">
  <div class="cover-card">
    <img src="images/cover.png" alt="Josh and Aira wedding save-the-date cover">
    <button class="open-btn" id="openInvitation">TAP TO OPEN INVITATION ♥</button>
  </div>
</section>
<audio id="weddingMusic" src="images/romantic-instrumental.wav" loop preload="auto"></audio>

<main id="book">
  <div class="topbar">
    <strong>Josh &amp; Aira</strong>
    <div class="controls">
      <button id="prev" aria-label="Previous page">‹ Back</button>
      <button id="next" aria-label="Next page">Next ›</button>
      <button id="musicToggle" aria-label="Toggle background music">♫ Music On</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <article class="page active"><img src="images/invitation.png" alt="Wedding invitation details for December 17, 2026 at 11 AM"></article>
    <article class="page"><img src="images/entourage.png" alt="The wedding entourage and principal sponsors"></article>
    <article class="page"><img src="images/secondary-bearers.png" alt="Secondary sponsors, bearers, and flower girls and boys"></article>
    <article class="page"><img src="images/secondary-wedding-party.png" alt="Best man, maid of honor, groomsmen, bridesmaids, candle, veil, and cord sponsors"></article>
    <article class="page"><img src="images/back-page.png" alt="Wedding invitation back page"></article>
  </div>
  <div class="progress"><span id="pageCount">Page 1 of 5</span><div class="dots" id="dots"></div></div>
</main>
<script>
const cover=document.getElementById('cover'), book=document.getElementById('book');
const pages=[...document.querySelectorAll('.page')], dots=document.getElementById('dots');
let current=0;
pages.forEach((_,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Go to page '+(i+1));b.addEventListener('click',()=>show(i));dots.appendChild(b)});
function show(i){current=Math.max(0,Math.min(pages.length-1,i));pages.forEach((p,n)=>p.classList.toggle('active',n===current));[...dots.children].forEach((d,n)=>d.classList.toggle('active',n===current));document.getElementById('pageCount').textContent=`Page ${current+1} of ${pages.length}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===pages.length-1}
const music=document.getElementById('weddingMusic');
const musicToggle=document.getElementById('musicToggle');
let musicPlaying=false;
async function startMusic(){try{await music.play();musicPlaying=true;musicToggle.textContent='♫ Music On';}catch(e){musicPlaying=false;musicToggle.textContent='♫ Play Music';}}
function pauseMusic(){music.pause();musicPlaying=false;musicToggle.textContent='♫ Music Off';}
document.getElementById('openInvitation').addEventListener('click',()=>{startMusic();cover.style.opacity='0';cover.style.transform='scale(.96)';setTimeout(()=>{cover.style.display='none';book.style.display='block';show(0);window.scrollTo(0,0)},450)});
musicToggle.addEventListener('click',()=>{if(musicPlaying)pauseMusic();else startMusic()});
document.getElementById('prev').addEventListener('click',()=>show(current-1));
document.getElementById('next').addEventListener('click',()=>show(current+1));
document.addEventListener('keydown',e=>{if(book.style.display==='block'){if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)}});
let startX=0;document.getElementById('stage').addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});
document.getElementById('stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>45)show(current+(dx<0?1:-1))},{passive:true});
show(0);
</script>
</body>
</html>
